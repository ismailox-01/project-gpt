stages:
  - install
  - test
  - build
  - sonar

cache:
  paths:
    - frontend/node_modules/
    - backend/node_modules/

install:
  stage: install
  script:
    - cd backend && npm ci
    - cd ../frontend && npm ci

test:
  stage: test
  script:
    - cd backend && npm test

build_frontend:
  stage: build
  script:
    - cd frontend && npm run build
  artifacts:
    paths:
      - frontend/dist/

sonar:
  stage: sonar
  image: sonarsource/sonar-scanner-cli:latest
  script:
    - sonar-scanner
  only:
    - main
